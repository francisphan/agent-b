apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-b

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - backendconfig.yaml
  - managedcertificate.yaml
  - ingress.yaml

images:
  - name: agent-b
    # `terraform output image_repository`
    newName: us-east1-docker.pkg.dev/your-gcp-project/agent-b/agent-b
    newTag: latest
