name: Weekly usage report

# Mondays 08:00 America/Argentina/Buenos_Aires (UTC-3) == 11:00 UTC.
# Also runnable on demand from the Actions tab.
#
# Emails the weekly Agent B usage digest AND commits the raw report JSON to
# usage-reports/<date>.json on main, so a scheduled cloud auditor can consume
# the history from the repo itself. Both happen in ONE script invocation
# (fetch once, then save + email).
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the snapshot back to main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The script is standalone (stdlib + requests) so we don't install the
      # whole agent-b package here — the ci.yml workflow already covers tests.
      - name: Install requests
        run: pip install requests

      - name: Send usage email and snapshot the report
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "SNAPSHOT_DATE=${DATE}" >> "$GITHUB_ENV"
          echo "SNAPSHOT_FILE=usage-reports/${DATE}.json" >> "$GITHUB_ENV"
          python scripts/send_usage_email.py --save-json "usage-reports/${DATE}.json"
        env:
          AGENT_B_URL: ${{ secrets.AGENT_B_URL }}
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          USAGE_REPORT_TO: ${{ secrets.USAGE_REPORT_TO }}

      - name: Commit report snapshot
        # Run even if the email step failed: the snapshot is written before the
        # send attempt, so a Gmail hiccup shouldn't lose the week's data.
        if: always()
        run: |
          FILE="${SNAPSHOT_FILE}"
          if [ -z "$FILE" ] || [ ! -s "$FILE" ]; then
            echo "No snapshot file to commit (fetch may have failed); skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "usage: weekly report snapshot ${SNAPSHOT_DATE}"
          git push
